name: Phase 1 checks
on:
  push:
  pull_request:
jobs:
  manufacturing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: garmentsos_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-password
      PAO_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: php artisan test --compact
      - run: php artisan test --compact --configuration=phpunit.mysql.xml
